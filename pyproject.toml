[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-chat-extractor"
version = "1.5.0"
description = "Fast, zero-dependency tool to extract conversations, metadata, and code from ChatGPT, Claude, Gemini, and Perplexity share links."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Subodh Ajgale", email = "129147755+darkdevil2806@users.noreply.github.com" }
]
requires-python = ">=3.8"
keywords = ["chatgpt", "claude", "gemini", "perplexity", "ai-chat", "markdown", "json", "extractor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/darkdevil2806/shared-chat-extractor"
Issues = "https://github.com/darkdevil2806/shared-chat-extractor/issues"

[project.scripts]
shared-chat-extractor = "extract_chat:main"

[tool.setuptools]
py-modules = ["extract_chat"]

[tool.setuptools.package-dir]
"" = "scripts"
